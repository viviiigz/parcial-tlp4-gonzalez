<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLP IV Recuperatorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cuaderno de estudio — barra fija de unidad + modo arriba, una columna de trabajo centrada debajo */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --sunken:#e9ebf2; --fg:#161a2b; --muted:#5a6079; --line:#d9dce7;
  --accent:#3438d0; --accent-ink:#ffffff; --accent-soft:#e6e7fb;
  --ok:#17804f; --ok-soft:#dcf2e6; --bad:#c0352b; --bad-soft:#fbe3e0;
  --u-poo:#7646c8; --u-pat:#0f7ea0; --u-solid:#b8561a; --u-exam:#17804f;
  --term-bg:#151827; --term-fg:#c8f0d8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f111a; --surface:#171a27; --sunken:#1f2333; --fg:#e7e9f3; --muted:#9aa0b9; --line:#2b3046;
  --accent:#8f93ff; --accent-ink:#0f111a; --accent-soft:#25285a;
  --ok:#4fcf8d; --ok-soft:#163626; --bad:#ff7b6f; --bad-soft:#3d1a18;
  --u-poo:#b393f2; --u-pat:#5cc4e6; --u-solid:#f2a066; --u-exam:#4fcf8d;
  --term-bg:#0a0c13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f111a; --surface:#171a27; --sunken:#1f2333; --fg:#e7e9f3; --muted:#9aa0b9; --line:#2b3046;
  --accent:#8f93ff; --accent-ink:#0f111a; --accent-soft:#25285a;
  --ok:#4fcf8d; --ok-soft:#163626; --bad:#ff7b6f; --bad-soft:#3d1a18;
  --u-poo:#b393f2; --u-pat:#5cc4e6; --u-solid:#f2a066; --u-exam:#4fcf8d;
  --term-bg:#0a0c13; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:var(--sunken);padding:.1em .35em;border-radius:4px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:18px 10px;border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:860px;margin:0 auto;display:grid;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:800;letter-spacing:-.02em}
.brand .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--fg));box-shadow:inset 0 0 0 1px var(--c,var(--fg));font-weight:700}
.tabs{display:flex;gap:2px;background:var(--sunken);padding:3px;border-radius:9px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:700;font-size:.92rem;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

main{padding-top:24px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.ubadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.ubadge::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.srcbadge{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

/* aviso */
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--u-exam);border-radius:var(--r);padding:14px 16px;margin-bottom:26px;display:grid;gap:6px}
.notice p{margin:0}
.notice ol{margin:0;padding-left:1.2em}

/* resumen */
.unit-block{display:grid;gap:14px;margin-bottom:40px}
.unit-head{display:grid;gap:4px;padding-bottom:10px;border-bottom:2px solid var(--c)}
.unit-head h2{font-size:1.6rem;font-weight:800}
.unit-head p{margin:0;color:var(--muted)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:200px}
details.sec summary{cursor:pointer;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.sec[open] summary::after{content:"−"}
.sec-body{padding:0 16px 14px}
.sum-tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sum-tools input{flex:1;min-width:200px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.85rem;color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px}
.toc a:hover{border-color:var(--c)}
.prose{max-width:74ch;display:grid;gap:10px}
.prose p,.prose ul,.prose ol{margin:0}
.prose ul,.prose ol{padding-left:1.25em;display:grid;gap:6px}
.prose h4{font-family:var(--display);font-size:1rem;margin:8px 0 0;color:var(--c)}
.prose .ex{padding:10px 14px;border-radius:8px;border:1px dashed var(--line);font-size:.95rem}
.prose .note{padding:9px 12px;border-radius:8px;background:var(--sunken);font-size:.93rem}
.prose .warn{padding:9px 12px;border-radius:8px;background:var(--bad-soft);font-size:.93rem}
.prose .ex b:first-child,.prose .note b:first-child,.prose .warn b:first-child{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.prose .note b:first-child{color:var(--c)}
.prose .warn b:first-child{color:var(--bad)}
.prose .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.prose .cols>div{min-width:0;display:grid;gap:6px;align-content:start}
.mini{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.mini table{min-width:420px}

/* código */
pre.code{margin:0;overflow-x:auto;background:var(--sunken);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:.82rem;line-height:1.55;tab-size:2;position:relative}
pre.code .tk-k{color:var(--accent);font-weight:600}
pre.code .tk-s{color:var(--ok)}
pre.code .tk-c{color:var(--muted);font-style:italic}
pre.code .tk-n{color:var(--u-solid)}
.code-wrap{position:relative;min-width:0}
.code-wrap .copy{position:absolute;top:6px;right:6px;opacity:.85}
pre.out{margin:0;overflow-x:auto;background:var(--term-bg);color:var(--term-fg);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:.84rem;line-height:1.55}

/* flashcards */
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.progress{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stats{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{perspective:1400px;cursor:pointer;margin-bottom:16px}
.card-in{display:grid;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;min-height:260px;display:flex;flex-direction:column;gap:14px}
.face.back{transform:rotateY(180deg)}
.face .q{font-family:var(--display);font-size:clamp(1.25rem,3.4vw,1.65rem);font-weight:700;line-height:1.25;margin:auto 0;text-wrap:balance}
.face .a{font-size:1.04rem;margin:auto 0;max-width:62ch}
.face .hint{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.05em}
.face .top-line{display:flex;justify-content:space-between;gap:8px}
.known-mark{font-family:var(--mono);font-size:.7rem;color:var(--ok)}
.fc-actions{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.fc-actions .btn{padding:12px}
.kbd{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-top:10px;text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px;text-align:center;display:grid;gap:12px;justify-items:center}

/* quiz */
.qz-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.qz-q{font-family:var(--display);font-size:clamp(1.15rem,3vw,1.4rem);font-weight:700;line-height:1.3}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-left:3px solid var(--c,var(--accent));padding:8px 12px;background:var(--sunken);border-radius:0 8px 8px 0;font-size:.95rem}
.qz-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score-big{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.miss{display:grid;gap:10px;margin-top:6px}
.miss div{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.94rem}
.miss b{display:block}
.qz-setup{display:grid;gap:14px}
.qz-setup h3{font-size:1.05rem}
.hist{font-family:var(--mono);font-size:.8rem;color:var(--muted)}

/* tablas */
.tbl-block{margin-bottom:30px;display:grid;gap:8px}
.tbl-block h3{font-size:1.15rem}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunken)}
tr:last-child td{border-bottom:0}
td.okc{color:var(--ok);font-weight:700}
td.badc{color:var(--bad);font-weight:700}

/* práctica */
.pr-bar{display:grid;gap:12px;margin-bottom:20px}
.timer-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:600}
.timer.late{color:var(--bad)}
.ex-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:20px;display:grid;gap:14px;margin-bottom:22px;scroll-margin-top:200px}
.ex-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ex-card h3{font-size:1.35rem}
.ex-card .temas{color:var(--muted);font-size:.92rem;margin:0}
.ex-card .done-mark{font-family:var(--mono);font-size:.72rem;color:var(--ok)}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.95rem}
.checks input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
details.reveal{border:1px solid var(--line);border-radius:9px;background:var(--bg)}
details.reveal summary{cursor:pointer;padding:9px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.reveal summary::-webkit-details-marker{display:none}
details.reveal summary::after{content:"mostrar";font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:400;align-self:center}
details.reveal[open] summary::after{content:"ocultar"}
details.reveal>div{padding:0 14px 14px;display:grid;gap:10px}
.ex-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:560px){
  .fc-actions{grid-template-columns:1fr 1fr}
  .fc-actions .nav{grid-row:2}
  .face{min-height:300px;padding:22px 18px}
  .ex-card{padding:16px}
}
@media (prefers-reduced-motion:reduce){.card-in,.progress i{transition:none}}
</style>
</head>

<script type="text/plain" id="c-poo-tipos">
let nombre: string = "Ana";
let edad: number = 30;            // no hay int/float: todo es number
let notas: number[] = [7, 8, 10];
let x = 5;                        // inferencia: x ya es number

// Sin enum: unión de literales (solo esos textos son válidos)
type TipoEnvio = "estandar" | "express";
let t: TipoEnvio = "express";
// t = "urgente";   ❌ error de compilación

function procesar(dato: unknown): string {
  if (typeof dato === "string") return dato.toUpperCase();   // narrowing
  return "desconocido";

</script>

<script type="text/plain" id="c-poo-clase">
class Producto {
  nombre: string;            // 1) se DECLARA el atributo con su tipo
  precio: number;

  constructor(nombre: string, precio: number) {
    this.nombre = nombre;    // 2) se ASIGNA con this  ← forma larga (la obligatoria)
    this.precio = precio;
  }

  describir(): string {
    return `${this.nombre}: $${this.precio}`;
  }
}

const p1 = new Producto("Teclado", 10000);   // instancia 1
const p2 = new Producto("Mouse", 5000);      // instancia 2: mismo molde, otro ESTADO

// ❌ PROHIBIDO en el parcial (parameter properties):
// class Producto { constructor(private nombre: string) {} }
</script>

<script type="text/plain" id="c-poo-encap">
class CuentaBancaria {
  private saldo: number = 0;            // nadie de afuera lo toca directo

  depositar(monto: number): void {
    if (monto <= 0) throw new Error("El monto debe ser mayor a 0");
    this.saldo += monto;                // validar ANTES de modificar
  }

  consultarSaldo(): number {            // lectura controlada
    return this.saldo;
  }
}

// cuenta.saldo = -999;   ❌ Property 'saldo' is private
</script>

<script type="text/plain" id="c-poo-getset">
class Persona {
  private _edad: number;               // atributo real con OTRO nombre

  constructor(edad: number) {
    this._edad = 0;                    // para que strict no se queje
    this.edad = edad;                  // pasa por el setter: valida al crear
  }

  get edad(): number { return this._edad; }        // p.edad (sin paréntesis)

  set edad(valor: number) {                        // p.edad = 17
    if (valor < 0 || valor > 120) throw new Error("Edad inválida");
    this._edad = valor;
  }

  get esMayor(): boolean { return this._edad >= 18; }  // getter calculado, solo lectura
}
</script>

<script type="text/plain" id="c-poo-herencia">
class Empleado {
  protected nombre: string;            // protected: las hijas lo pueden leer
  constructor(nombre: string) {
    this.nombre = nombre;
  }
  calcularSueldo(): number { return 0; }
  describir(): string {
    return `${this.nombre}: $${this.calcularSueldo()}`;
  }
}

class EmpleadoFijo extends Empleado {
  private sueldoBase: number;
  constructor(nombre: string, sueldoBase: number) {
    super(nombre);                     // 1° SIEMPRE super, antes de usar this
    this.sueldoBase = sueldoBase;
  }
  override calcularSueldo(): number {  // redefine el método del padre
    return this.sueldoBase;
  }
  override describir(): string {
    return super.describir() + " (fijo)";   // llama a la versión del padre
  }
}
</script>

<script type="text/plain" id="c-poo-poli">
const equipo: Empleado[] = [
  new EmpleadoFijo("Juan", 100000),
  new EmpleadoPorHoras("Marta", 80, 2500),
];

// ✅ CON polimorfismo: la misma línea, cada objeto responde a su manera
let total = 0;
for (const e of equipo) {
  total += e.calcularSueldo();
}

// ❌ SIN polimorfismo (lo que NO hay que hacer)
// if (e instanceof EmpleadoFijo) { ... } else if (e instanceof EmpleadoPorHoras) { ... }
</script>

<script type="text/plain" id="c-poo-abstracta">
abstract class Habitacion {
  readonly numero: number;                          // puede tener ESTADO
  constructor(numero: number) {
    this.numero = numero;
  }
  abstract calcularPrecio(noches: number): number;  // sin cuerpo: las hijas DEBEN escribirlo
  describir(): string {                             // puede tener métodos con código
    return `Habitación ${this.numero}`;
  }
}
// new Habitacion(1);   ❌ no se puede instanciar una clase abstracta

class Suite extends Habitacion {                    // sin constructor: usa el del padre
  calcularPrecio(noches: number): number {
    return 50000 * noches;
  }
}

interface Pagable {                                 // contrato puro: sin código ni estado
  descripcion: string;
  monto(): number;
}

class Factura implements Pagable {
  descripcion: string;
  private importe: number;
  constructor(descripcion: string, importe: number) {
    this.descripcion = descripcion;
    this.importe = importe;
  }
  monto(): number { return this.importe; }
}
</script>

<script type="text/plain" id="c-poo-static">
class Hotel {

  }

  get cantidad(): number {               // de ESTE hotel, ahora
    return this.habitaciones.length;
  }
}

}

console.log(Hotel.totalCheckIns);        // sin new: pertenece a la clase
</script>

<script type="text/plain" id="c-pat-factory">

  calcularCosto(base: number): number { return base; }

  static crear(tipo: "estandar" | "express"): Envio {   // devuelve el tipo COMÚN

  }
}

<script type="text/plain" id="c-pat-observer">
interface Observador {                               // ① contrato del observador
  actualizar(nombre: string, estado: string): void;
}

class Soporte implements Observador {                // ② observador concreto
  actualizar(nombre: string, estado: string): void {
    console.log(`Soporte: ${nombre} pasó a ${estado}`);
  }
}

class Equipo {                                       // ③ SUJETO
  readonly nombre: string;
  private estado: string = "ok";
  private observadores: Observador[] = [];           // lista de la INTERFAZ

  constructor(nombre: string) {
    this.nombre = nombre;
  }

  agregarObservador(o: Observador): void { this.observadores.push(o); }
  quitarObservador(o: Observador): void {
    this.observadores = this.observadores.filter((x) => x !== o);
  }

  cambiarEstado(nuevo: string): void {
    this.estado = nuevo;
    this.notificar();                                // cambia → avisa
  }

  private notificar(): void {
    for (const o of this.observadores) o.actualizar(this.nombre, this.estado);
  }
}
</script>

<script type="text/plain" id="c-pat-adapter">
// ① TARGET: lo que espera el sistema nuevo
interface Suscriptor {
  avisar(pelicula: string, fecha: string): void;
}

// ② ADAPTEE: la clase vieja, con otra interfaz. NO SE MODIFICA.
class SistemaPushViejo {
  mandarPush(token: string, titulo: string, cuerpo: string): boolean {
    console.log(`PUSH[${token}] ${titulo} — ${cuerpo}`);
    return true;
  }
}

// ③ ADAPTER: implementa el target y GUARDA al adaptee (composición)
class PushAdapter implements Suscriptor {
  private push: SistemaPushViejo;
  private token: string;

  constructor(push: SistemaPushViejo, token: string) {
    this.push = push;
    this.token = token;
  }

  avisar(pelicula: string, fecha: string): void {
    this.push.mandarPush(this.token, "¡Estreno!", `${pelicula} (${fecha})`);   // TRADUCE
  }
}
</script>

<script type="text/plain" id="c-solid-lsp">
class Rectangle {
  protected width: number;
  protected height: number;
  constructor(w: number, h: number) { this.width = w; this.height = h; }
  setWidth(w: number): void { this.width = w; }
  setHeight(h: number): void { this.height = h; }
  area(): number { return this.width * this.height; }
}

// ❌ Square "es un" rectángulo en matemática, pero NO se comporta como uno
class Square extends Rectangle {
  constructor(side: number) { super(side, side); }
  override setWidth(w: number): void { this.width = w; this.height = w; }   // sorpresa
  override setHeight(h: number): void { this.width = h; this.height = h; }  // sorpresa
}

function agrandar(r: Rectangle): void {
  r.setWidth(5);
  r.setHeight(10);
  console.log(`Esperada: 50. Obtenida: ${r.area()}`);
}
agrandar(new Square(1));   // Obtenida: 100  ← la subclase rompió lo que esperaba la función

// ✅ Solución: sacar la herencia y usar un contrato que ambos cumplan de verdad
interface Shape { area(): number; }
</script>

abstract class Vehiculo {
  readonly patente: string;

  constructor(patente: string) {
    this.patente = patente;
  }

  abstract calcularTarifa(horas: number): number;
}

class Auto extends Vehiculo {
  calcularTarifa(horas: number): number {
    return 1000 * horas;
  }
}

  calcularTarifa(horas: number): number {
    return 500 * horas;
  }
}

  private vehiculos: Vehiculo[] = [];
  static totalIngresos: number = 0;

  ingresar(vehiculo: Vehiculo): void {

    return this.vehiculos.length;

}

  static readonly ANTEOJOS = 500;   // constante de clase
  precioEntrada(): number {
    return 8500 + Funcion3D.ANTEOJOS;
  }
}

class Funcion4D extends Funcion {
  precioEntrada(): number {
    return 12000;
  }
}

class Complejo {
  private funciones: Funcion[] = [];
  static totalEntradas: number = 0;

  programar(funcion: Funcion): void {
    this.funciones.push(funcion);
  }

  vender(sala: number, cantidad: number): number {
    const funcion = this.funciones.find((f) => f.sala === sala);
    if (funcion === undefined) {
      throw new Error(`No hay función en la sala ${sala}`);
    }
    Complejo.totalEntradas += cantidad;
    return funcion.precioEntrada() * cantidad;
  }

  get cantidadFunciones(): number {
    return this.funciones.length;
  }

  cartelera(): void {
    for (const f of this.funciones) {
      console.log(`Sala ${f.sala} · ${f.pelicula}: $${f.precioEntrada()}`);
    }
  }
}

// Bloque de prueba
const complejo = new Complejo();
complejo.programar(new Funcion2D(1, "Relatos salvajes"));
complejo.programar(new Funcion3D(2, "Avatar"));
complejo.programar(new Funcion4D(3, "Dune"));
complejo.cartelera();
console.log(`Venta sala 2: $${complejo.vender(2, 3)}`);
console.log(`Venta sala 3: $${complejo.vender(3, 2)}`);
try {
  complejo.vender(9, 1);
} catch (e) {
  if (e instanceof Error) console.log(e.message);
}
console.log(`Funciones: ${complejo.cantidadFunciones}`);
console.log(`Entradas vendidas: ${Complejo.totalEntradas}`);
</script>

<script type="text/plain" id="c-sol-c2">
// Observer: contrato del observador
interface Suscriptor {
  avisar(pelicula: string, fecha: string): void;
}

class SuscriptorEmail implements Suscriptor {
  private email: string;
  constructor(email: string) {
    this.email = email;
  }
  avisar(pelicula: string, fecha: string): void {
    console.log(`Email a ${this.email}: estreno de ${pelicula} el ${fecha}`);
  }
}

// Adaptee: dado, no se modifica
class SistemaPushViejo {
  mandarPush(token: string, titulo: string, cuerpo: string): boolean {
    console.log(`PUSH[${token}] ${titulo} — ${cuerpo}`);
    return true;
  }
}

// Adapter: implementa Suscriptor y traduce a mandarPush
class PushAdapter implements Suscriptor {
  private push: SistemaPushViejo;
  private token: string;

  constructor(push: SistemaPushViejo, token: string) {
    this.push = push;
    this.token = token;
  }

  avisar(pelicula: string, fecha: string): void {
    this.push.mandarPush(this.token, "¡Estreno!", `${pelicula} (${fecha})`);
  }
}

// Observer: sujeto
class Cartelera {
  private suscriptores: Suscriptor[] = [];

  suscribir(s: Suscriptor): void {
    this.suscriptores.push(s);
  }

  desuscribir(s: Suscriptor): void {
    this.suscriptores = this.suscriptores.filter((x) => x !== s);
  }

  anunciarEstreno(pelicula: string, fecha: string): void {
    for (const s of this.suscriptores) {
      s.avisar(pelicula, fecha);
    }
  }
}

// Bloque de prueba
const cartelera = new Cartelera();
const ana = new SuscriptorEmail("ana@mail.com");
cartelera.suscribir(ana);
cartelera.suscribir(new PushAdapter(new SistemaPushViejo(), "tok-77"));
cartelera.anunciarEstreno("Dune 3", "12/03");
cartelera.desuscribir(ana);
cartelera.anunciarEstreno("Toy Story 5", "19/06");
</script>

<script type="text/plain" id="c-sol-c3">
// OCP: se pueden agregar descuentos nuevos sin modificar ServicioEntradas
interface Descuento {
  nombre: string;
  aplicar(precio: number): number;
}

class SinDescuento implements Descuento {
  nombre = "general";
  aplicar(precio: number): number {
    return precio;
  }
}

class DescuentoEstudiante implements Descuento {
  nombre = "estudiante";
  aplicar(precio: number): number {
    return precio * 0.7;
  }
}

class DescuentoJubilado implements Descuento {
  nombre = "jubilado";
  aplicar(precio: number): number {
    return precio * 0.5;
  }
}

// SRP: imprimir el ticket es una responsabilidad aparte del cálculo
interface Impresora {
  imprimir(lineas: string[]): void;
}

class ImpresoraConsola implements Impresora {
  imprimir(lineas: string[]): void {
    for (const linea of lineas) console.log(linea);
  }
}

class ServicioEntradas {
  private impresora: Impresora;

  constructor(impresora: Impresora) {
    this.impresora = impresora;
  }

  emitir(pelicula: string, precio: number, descuento: Descuento): number {
    const final = descuento.aplicar(precio);
    this.impresora.imprimir([`*** ${pelicula} ***`, `Tarifa ${descuento.nombre}: $${final}`]);
    return final;
  }
}

// Bloque de prueba (misma salida que el original)
const servicio = new ServicioEntradas(new ImpresoraConsola());
let total = 0;
total += servicio.emitir("Dune", 10000, new SinDescuento());
total += servicio.emitir("Dune", 10000, new DescuentoEstudiante());
total += servicio.emitir("Dune", 10000, new DescuentoJubilado());
console.log(`Recaudado: $${total}`);
</script>

  override despacharEquipaje(_kilos: number): string {

<script type="text/plain" id="c-sol-d1">
abstract class Paquete {
  readonly destino: string;
  private _noches: number;

  constructor(destino: string, noches: number) {
    this.destino = destino;
    this._noches = 0;
    this.noches = noches;            // pasa por el setter: valida al crear
  }

  get noches(): number {
    return this._noches;
  }

  set noches(valor: number) {
    if (!Number.isInteger(valor) || valor < 1 || valor > 30) {
      throw new Error("Las noches deben estar entre 1 y 30");
    }
    this._noches = valor;
  }

  abstract precioPorNoche(): number;

  precioTotal(): number {
    return this.precioPorNoche() * this._noches;
  }
}

class PaqueteNacional extends Paquete {
  precioPorNoche(): number {
    return 40000;
  }
}

class PaqueteInternacional extends Paquete {
  static readonly TASA_AEROPORTUARIA = 60000;

  precioPorNoche(): number {
    return 90000;
  }

  override precioTotal(): number {
    return super.precioTotal() + PaqueteInternacional.TASA_AEROPORTUARIA;   // reutiliza al padre
  }
}

class Agencia {
  private ventas: Paquete[] = [];
  static paquetesVendidos: number = 0;

  vender(p: Paquete): void {
    this.ventas.push(p);
    Agencia.paquetesVendidos++;
  }

  get totalVendido(): number {
    return this.ventas.reduce((acc, p) => acc + p.precioTotal(), 0);
  }

  resumen(): void {
    for (const p of this.ventas) {
      console.log(`${p.destino} (${p.noches} noches): $${p.precioTotal()}`);
    }
  }
}

// Bloque de prueba
const agencia = new Agencia();
const bariloche = new PaqueteNacional("Bariloche", 5);
agencia.vender(bariloche);
agencia.vender(new PaqueteInternacional("Madrid", 7));
bariloche.noches = 6;
agencia.resumen();
try {
  bariloche.noches = 45;
} catch (e) {
  if (e instanceof Error) console.log(e.message);
}
console.log(`Total vendido: $${agencia.totalVendido}`);
console.log(`Paquetes vendidos: ${Agencia.paquetesVendidos}`);
</script>

<script type="text/plain" id="c-sol-d2">
class CotizacionDolar {
  private static instancia: CotizacionDolar | undefined;
  readonly valor = 1000;

  private constructor() {}

  static obtenerInstancia(): CotizacionDolar {
    if (CotizacionDolar.instancia === undefined) {
      CotizacionDolar.instancia = new CotizacionDolar();
    }
    return CotizacionDolar.instancia;
  }
}

interface Servicio {
  descripcion(): string;
  precioEnPesos(): number;
}

class Excursion implements Servicio {
  private nombre: string;
  private pesos: number;
  constructor(nombre: string, pesos: number) {
    this.nombre = nombre;
    this.pesos = pesos;
  }
  descripcion(): string {
    return `Excursión ${this.nombre}`;
  }
  precioEnPesos(): number {
    return this.pesos;
  }
}

class VueloInternacional implements Servicio {
  private ruta: string;
  private dolares: number;
  constructor(ruta: string, dolares: number) {
    this.ruta = ruta;
    this.dolares = dolares;
  }
  descripcion(): string {
    return `Vuelo ${this.ruta}`;
  }
  precioEnPesos(): number {
    return this.dolares * CotizacionDolar.obtenerInstancia().valor;   // no se escribe 1000
  }
}

class FabricaServicios {
  static crear(tipo: "excursion" | "vuelo", nombre: string, monto: number): Servicio {
    if (tipo === "excursion") {
      return new Excursion(nombre, monto);
    }
    return new VueloInternacional(nombre, monto);
  }
}

// Bloque de prueba
console.log(`Mismo Singleton: ${CotizacionDolar.obtenerInstancia() === CotizacionDolar.obtenerInstancia()}`);
const servicios: Servicio[] = [
  FabricaServicios.crear("excursion", "Cerro Catedral", 85000),
  FabricaServicios.crear("vuelo", "EZE-MAD", 950),
];
let total = 0;
for (const s of servicios) {
  console.log(`${s.descripcion()}: $${s.precioEnPesos()}`);
  total += s.precioEnPesos();
}
console.log(`Total: $${total}`);
</script>

<script type="text/plain" id="c-sol-d3">
// ISP: interfaces chicas; cada transporte implementa solo lo que ofrece
interface Reservable {
  readonly nombre: string;
  reservarAsiento(pasajero: string): string;
}

// ISP: solo los transportes que llevan equipaje
interface ConEquipaje {
  despacharEquipaje(kilos: number): string;
}

// ISP + LSP: solo los que sirven comida; nadie hereda un método que no puede cumplir
interface ConServicioABordo {
  servirComida(): string;
}

class Avion implements Reservable, ConEquipaje, ConServicioABordo {
  readonly nombre = "Avión";
  reservarAsiento(pasajero: string): string {
    return `${this.nombre}: asiento para ${pasajero}`;
  }
  despacharEquipaje(kilos: number): string {
    return `${this.nombre}: ${kilos} kg despachados`;
  }
  servirComida(): string {
    return `${this.nombre}: menú servido`;
  }
}

class Colectivo implements Reservable, ConEquipaje {
  readonly nombre = "Colectivo";
  reservarAsiento(pasajero: string): string {
    return `${this.nombre}: asiento para ${pasajero}`;
  }
  despacharEquipaje(kilos: number): string {
    return `${this.nombre}: ${kilos} kg en bodega`;
  }
}

class Traslado implements Reservable {
  readonly nombre = "Traslado";
  reservarAsiento(pasajero: string): string {
    return `${this.nombre}: lugar para ${pasajero}`;
  }
}

function reservarTodos(transportes: Reservable[], pasajero: string): void {
  for (const t of transportes) console.log(t.reservarAsiento(pasajero));
}

function servirATodos(transportes: ConServicioABordo[]): void {
  for (const t of transportes) console.log(t.servirComida());
}

// Bloque de prueba
const avion = new Avion();
const colectivo = new Colectivo();
const traslado = new Traslado();
reservarTodos([avion, colectivo, traslado], "Ana");
console.log(avion.despacharEquipaje(23));
console.log(colectivo.despacharEquipaje(15));
servirATodos([avion]);
// servirATodos([colectivo]);        ❌ no compila: Colectivo no es ConServicioABordo
// traslado.despacharEquipaje(10);   ❌ no compila: Traslado no tiene ese método
</script>

<script>
const UNITS = {
  poo:   {name:"POO", full:"TypeScript y POO", c:"var(--u-poo)", desc:"Clases, los cuatro pilares, clase abstracta vs interface, static, readonly, getters y las reglas del examen. Es el ejercicio 1."},
  pat:   {name:"Patrones", full:"Patrones de diseño", c:"var(--u-pat)", desc:"Singleton, Factory Method, Observer y Adapter: categoría, problema, piezas, ventajas y desventajas. Es el ejercicio 2."},
  solid: {name:"SOLID", full:"Principios SOLID", c:"var(--u-solid)", desc:"SRP, OCP, LSP, ISP y DIP: la señal en el código, la solución y cómo refactorizar sin cambiar la salida. Es el ejercicio 3."},
  exam:  {name:"El parcial", full:"Cómo se rinde el parcial", c:"var(--u-exam)", desc:"Setup del proyecto, commits de control, estrategia de 90 minutos, frases de consigna y la revisión de tu Tema B."}
};

/* ---------------- TEORÍA ---------------- */
const SUMMARY = {
poo:[
{h:"1. TypeScript: lo mínimo indispensable",html:`
<p><b>TypeScript = JavaScript + tipos.</b> Los tipos existen mientras escribís y verificás con <code>npx tsc</code>. Al ejecutar, se borran y queda JavaScript común.</p>
<ul><li><b>Tipado estático</b>: los errores de tipo se detectan <b>antes</b> de ejecutar.</li>
<li><b>Los tipos no existen en ejecución</b>: no podés hacer <code>instanceof MiInterfaz</code> (las interfaces desaparecen). Con <b>clases</b> sí, porque las clases existen en JavaScript.</li>
<li><b>Inferencia</b>: <code>let x = 5</code> ya es <code>number</code>. Igual tipá siempre <b>parámetros y retorno</b> de métodos (en <code>strict</code> un parámetro sin tipo es error).</li>
<li><b>Sin <code>enum</code></b> (prohibido): un conjunto fijo de opciones se escribe como <b>unión de literales</b>: <code>"estandar" | "express"</code>. Un valor mal escrito no compila.</li>
<li><b><code>any</code> está prohibido</b>: apaga el chequeo. Si no sabés el tipo, usá <code>unknown</code> y comprobalo con <code>typeof</code> / <code>instanceof</code> (eso se llama <b>narrowing</b>).</li>
<li>Con <code>strict</code>, <code>string</code> no incluye <code>undefined</code>: si algo puede faltar se escribe <code>Producto | undefined</code>.</li></ul>
<pre class="code" data-code="poo-tipos"></pre>`},
{h:"2. TypeScript en el proyecto: instalación local y tsconfig",html:`
<p>Esto salió en <b>las dos teorías</b> (Tema A pregunta 1 y 2, Tema B pregunta 1 y 2).</p>
<ul><li><code>npm i -D typescript</code>: el flag <b>-D</b> lo instala como <b>dependencia de desarrollo</b> (<code>devDependencies</code>). Se usa para programar y verificar, no en producción.</li>
<li><b>Ventaja de instalarlo local</b>: <b>cada proyecto fija su propia versión</b>, sin depender de lo instalado en la máquina. Se ejecuta con <code>npx tsc</code>.</li>
<li><code>noEmit: true</code>: <code>tsc</code> <b>solo verifica los tipos, no genera archivos .js</b>.</li>
<li><code>erasableSyntaxOnly</code>: solo se acepta sintaxis que se pueda <b>borrar</b>. Por eso <code>enum</code> y los <i>parameter properties</i> no compilan.</li>
<li><code>node archivo.ts</code> con un error de tipos: <b>Node lo ejecuta igual</b>, porque solo <b>borra</b> las anotaciones de tipo sin verificarlas. Que corra no significa que <code>npx tsc</code> pase.</li></ul>
<div class="warn"><b>Trampa</b> "Node detiene la ejecución y muestra el error de tipos" es FALSO. Quien detecta los errores de tipo es <code>tsc</code>, no <code>node</code>.</div>`},
{h:"3. Clases, objetos, constructor y this",html:`
<ul><li><b>Clase</b>: el <b>molde</b>. Define atributos (datos) y métodos (comportamiento).</li>
<li><b>Objeto / instancia</b>: cada cosa concreta creada con <code>new</code>.</li>
<li><b>Constructor</b>: se ejecuta al hacer <code>new</code>; inicializa los atributos.</li>
<li><b><code>this</code></b>: "el objeto actual".</li></ul>
<p>Si creás tres instancias de la misma clase, lo que varía entre ellas es el <b>estado</b>: los <b>valores de sus atributos</b>. Los métodos y el constructor son los mismos para todas (Tema A, pregunta 3).</p>
<pre class="code" data-code="poo-clase"></pre>
<div class="note"><b>Regla del examen</b> Constructor en <b>forma larga</b>: declarar el atributo y asignarlo con <code>this.x = x</code>. Nada de <code>constructor(private x: string)</code>. Con <code>strict</code>, todo atributo declarado tiene que asignarse en el constructor o tener valor inicial (<code>private lista: X[] = []</code>).</div>`},
{h:"4. Pilar 1: Abstracción",html:`
<p><b>Abstraer es quedarse solo con lo que importa para el problema</b> y descartar el resto. Un <code>Cliente</code> de un banco tiene DNI, nombre y cuentas; el color de ojos no aporta nada.</p>
<ul><li>Se ve en <b>qué atributos y métodos elegís</b> poner en la clase.</li>
<li>También es abstracción <b>ocultar el "cómo"</b> detrás de un nombre claro: quien llama a <code>vender(3)</code> no necesita saber cómo se descuenta el stock.</li>
<li>Niveles: clase concreta → <b>clase abstracta</b> (molde parcial) → <b>interface</b> (contrato puro).</li></ul>
<div class="note"><b>Abstracción vs encapsulamiento</b> Abstracción = <b>qué</b> muestro y modelo. Encapsulamiento = <b>cómo protejo</b> el estado.</div>`},
{h:"5. Pilar 2: Encapsulamiento y modificadores de acceso",html:`
<p><b>El objeto protege su propio estado</b>: desde afuera solo se modifica a través de sus métodos, que validan.</p>
<pre class="code" data-code="poo-encap"></pre>
<div class="mini"><table><thead><tr><th>Modificador</th><th>¿Quién lo ve?</th><th>Uso típico</th></tr></thead><tbody>
<tr><td><b>public</b> (por defecto)</td><td>Todos</td><td>Operaciones que ofrece el objeto</td></tr>
<tr><td><b>private</b></td><td>Solo la propia clase</td><td>Estado interno, listas internas</td></tr>
<tr><td><b>protected</b></td><td>La clase y sus subclases, <b>no desde afuera</b></td><td>Datos que las hijas necesitan</td></tr>
<tr><td><b>readonly</b></td><td>Se lee, pero se asigna <b>una sola vez</b> (al declarar o en el constructor)</td><td>Identificadores: <code>numero</code>, <code>patente</code></td></tr>
</tbody></table></div>
<ul><li>Validar <b>antes</b> de modificar: si falla, el objeto queda como estaba.</li>
<li>Lanzar <code>Error</code> en vez de <code>console.log</code> cuando algo es inválido.</li>
<li>No devolver la referencia a una lista interna: devolver una copia <code>[...this.lista]</code>.</li></ul>`},
{h:"6. Getters y setters",html:`
<p>Un <b>getter</b> se lee como atributo pero ejecuta código. Un <b>setter</b> se asigna como atributo pero ejecuta código (por ejemplo, validar).</p>
<pre class="code" data-code="poo-getset"></pre>
<ul><li>El atributo real se llama distinto (<code>_edad</code>). <b>Si se llamara igual que el setter, se llamaría a sí mismo infinitamente</b>.</li>
<li>En el constructor se asigna con el setter (<code>this.edad = edad</code>) para validar también al crear.</li>
<li>Getter <b>sin</b> setter = propiedad de solo lectura calculada (ej.: <code>get cantidad()</code> del parcial).</li>
<li>Getter para algo que "se siente" un dato (<code>cantidad</code>, <code>total</code>); método para una acción o algo con parámetros (<code>calcularPrecio(noches)</code>).</li></ul>`},
{h:"7. Pilar 3: Herencia",html:`
<p>Una <b>subclase</b> toma atributos y métodos de una <b>superclase</b> y puede agregar o redefinir. Relación <b>"es un"</b>.</p>
<pre class="code" data-code="poo-herencia"></pre>
<ul><li><code>extends</code>: herencia <b>simple</b> (una sola clase padre).</li>
<li><code>super(...)</code> es <b>obligatorio</b> en el constructor de la hija y va <b>antes de usar <code>this</code></b>.</li>
<li>Si la hija <b>no</b> declara constructor, usa el del padre (por eso <code>class Suite extends Habitacion</code> no lo necesita).</li>
<li>Si el padre declara algo <code>private</code>, la hija no lo puede leer: usá <code>protected</code>.</li>
<li><b>Override</b>: la hija redefine un método heredado con la misma firma. <b>Overload</b>: varias firmas del mismo nombre en la misma clase.</li></ul>`},
{h:"8. Pilar 4: Polimorfismo",html:`
<p><b>Mismo mensaje, distinto comportamiento</b> según el objeto real que lo recibe. Es lo que pide "recorre el arreglo y muestra cuánto paga cada uno, llamando al método de cada objeto (sin <code>if</code> por tipo)".</p>
<pre class="code" data-code="poo-poli"></pre>
<div class="note"><b>Pregunta del Tema B</b> "Se recorre una lista de Empleado llamando a <code>calcularSueldo()</code> y cada objeto responde con su propio cálculo, sin que el código sepa de qué tipo es cada uno" → <b>Polimorfismo</b>. No es encapsulamiento (proteger estado) ni abstracción (modelar lo relevante).</div>
<p>La señal de que lo usaste bien: <b>no hay ningún <code>if</code>/<code>switch</code>/<code>instanceof</code> preguntando el tipo</b>. Si aparece un tipo nuevo, se agrega una clase y no se toca el recorrido (eso es OCP).</p>`},
{h:"9. Clase abstracta vs interface",html:`
<pre class="code" data-code="poo-abstracta"></pre>
<div class="cols"><div><h4>Clase abstracta</h4><ul><li><b>Molde parcial</b>: código común + métodos <code>abstract</code> que cada hija completa.</li><li>Puede tener <b>estado</b> y constructor.</li><li><b>No se instancia</b>.</li><li>Una clase extiende <b>una sola</b>.</li><li>Relación "es un".</li></ul></div>
<div><h4>Interface</h4><ul><li><b>Contrato puro</b>: solo firmas, sin código ni estado.</li><li>Una clase implementa <b>varias</b> (<code>implements A, B</code>).</li><li>Desaparece al ejecutar.</li><li>Relación "puede hacer".</li></ul></div></div>
<div class="note"><b>En el parcial</b> Ejercicio 1: <code>abstract class</code> con método abstracto (Vehiculo, Habitacion). Ejercicio 2 y 3: <code>interface</code> (Pedido, Envio, Canal, Registro).</div>`},
{h:"10. static y readonly",html:`
<pre class="code" data-code="poo-static"></pre>
<ul><li><b><code>static</code> pertenece a la clase y es compartido por todas sus instancias</b> (Tema B pregunta 3). Se accede con <code>Clase.miembro</code>, también dentro de los métodos: <code>Hotel.totalCheckIns</code>, <b>no</b> <code>this.totalCheckIns</code>.</li>
<li>Usos: contadores globales, constantes de clase, métodos que no dependen de un objeto (<code>FabricaEnvios.crear</code>) y la instancia del Singleton.</li>
<li><b><code>readonly</code> impide que se reasigne después del constructor, incluso desde dentro de la clase</b> (Tema B pregunta 4). Sí se puede leer desde afuera.</li>
<li><code>readonly</code> en un arreglo protege la <b>referencia</b>, no el contenido: <code>push</code> sigue funcionando.</li></ul>
<div class="note"><b>Static vs getter</b> <code>Hotel.totalCheckIns</code> cuenta todos los ingresos de la historia (clase). <code>hotel.cantidad</code> cuenta cuántas hay ahora en ese hotel (instancia).</div>`},
{h:"11. Relaciones: herencia vs composición",html:`
<ul><li><b>Herencia</b>: "<b>es un</b>" → <code>class Suite extends Habitacion</code>.</li>
<li><b>Composición</b>: "<b>tiene un</b>" y la parte no vive sin el todo → un atributo creado y poseído por la clase.</li>
<li><b>Agregación</b>: "tiene un", pero la parte existe por separado (se recibe de afuera).</li>
<li><b>Asociación / uso</b>: "usa un" → un parámetro de un método.</li></ul>
<pre class="code" data-code="poo-compos"></pre>
<div class="note"><b>Tema A pregunta 5</b> "Un Auto tiene un Motor" → <b>composición</b>: el Auto guarda una instancia de Motor como atributo. <b>"Preferí composición sobre herencia"</b>: la herencia acopla fuerte y solo se hereda de una clase.</div>`},
{h:"12. Errores y copias defensivas",html:`
<pre class="code" data-code="poo-errores"></pre>
<ul><li><code>throw</code> corta la ejecución y obliga a quien llama a enterarse; un <code>console.log</code> se pierde.</li>
<li>En <code>catch (e)</code>, con strict <code>e</code> es <code>unknown</code>: preguntá <code>e instanceof Error</code> antes de usar <code>e.message</code>.</li>
<li>Errores propios: clases que extienden <code>Error</code> y llaman a <code>super(mensaje)</code>.</li>
<li>Los arreglos se pasan por referencia: devolver <code>[...this.lista]</code>, no <code>this.lista</code>.</li></ul>`},
{h:"13. Trampas frecuentes del ejercicio 1",html:`
<ol><li>Olvidar <code>super(...)</code> o usar <code>this</code> antes → no compila.</li>
<li><code>private</code> en el padre cuando la hija lo necesita → <code>protected</code>.</li>
<li>Acceder al <code>static</code> con <code>this</code> → es <code>Clase.atributo</code>.</li>
<li><code>if (h instanceof Suite)</code> en el recorrido → falta polimorfismo.</li>
<li>Salida distinta por una tilde: "histórico" ≠ "historico", "Habitación" ≠ "Habitacion".</li>
<li>Imprimir con <code>console.log</code> dentro de un método que debía <b>devolver</b> un valor.</li>
<li>Usar <code>enum</code>, <code>any</code> o parameter properties → regla del examen rota.</li>
<li><code>node archivo.ts</code> no verifica tipos: corré <code>npx tsc</code> siempre.</li></ol>`}
],
pat:[
{h:"1. ¿Qué es un patrón y cuáles son las categorías?",html:`
<p>Un <b>patrón de diseño</b> es una <b>solución probada y reutilizable a un problema recurrente</b> del diseño orientado a objetos. No es código para copiar: es una plantilla de cómo organizar clases, con un nombre que todos conocen. Vienen del libro <i>Design Patterns</i> (1994) de la <b>Gang of Four</b>: Gamma, Helm, Johnson y Vlissides.</p>
<div class="mini"><table><thead><tr><th>Categoría</th><th>Se ocupa de…</th><th>Patrones de la materia</th></tr></thead><tbody>
<tr><td><b>Creacionales</b></td><td><b>Cómo se crean</b> los objetos</td><td>Singleton, Factory Method</td></tr>
<tr><td><b>Estructurales</b></td><td><b>Cómo se conectan</b> clases y objetos</td><td>Adapter</td></tr>
<tr><td><b>Comportamentales</b></td><td><b>Cómo se comunican</b> y se reparten responsabilidades</td><td>Observer</td></tr></tbody></table></div>
<div class="note"><b>Mnemotecnia</b> <b>crear</b> → creacional · <b>conectar</b> → estructural · <b>avisar / comunicar</b> → comportamental. El Observer es <b>comportamental</b>, no estructural (Tema A pregunta 7).</div>`},
{h:"2. Singleton (creacional)",html:`
<p><b>Problema</b>: que de una clase exista <b>una única instancia</b>, accesible desde cualquier lugar (configuración, conexión a la base, log central).</p>
<pre class="code" data-code="pat-singleton"></pre>
<h4>Las tres piezas</h4>
<ol><li><b><code>private constructor</code></b>: para que <b>no se puedan crear instancias con <code>new</code> desde fuera de la clase</b> (Tema A pregunta 6).</li>
<li><b><code>private static instancia</code></b>: <code>static</code> porque es de la clase; tipo <code>X | undefined</code> porque al principio no existe.</li>
<li><b><code>static obtenerInstancia()</code></b>: <code>static</code> porque se llama <b>antes</b> de tener un objeto. Crea solo la primera vez (inicialización perezosa).</li></ol>
<div class="cols"><div><h4>Ventajas</h4><ul><li>Control de recursos compartidos.</li><li>Evita crear objetos de más.</li><li>Acceso global controlado.</li></ul></div>
<div><h4>Desventajas</h4><ul><li>Problemas en entornos concurrentes.</li><li><b>Dificulta las pruebas unitarias</b>.</li><li>Es estado global; puede violar SRP.</li></ul></div></div>
<div class="note"><b>En el parcial</b> El valor (<code>costoEnvio = 1500</code>, <code>recargoExpress = 2500</code>) se declara <code>readonly</code> en el Singleton y las demás clases lo <b>leen</b> con <code>X.obtenerInstancia().valor</code>. Nunca escribas el número suelto en otra clase.</div>`},
{h:"3. Factory Method (creacional)",html:`
<p><b>Idea central</b>: <b>delegar la creación de objetos a una fábrica en lugar de usar <code>new</code> directamente</b> (Tema B pregunta 6). Quien usa los objetos solo conoce el tipo común.</p>
<pre class="code" data-code="pat-factory"></pre>
<h4>Cómo se reconoce</h4>
<ol><li>Un <b>tipo común</b> (interfaz o clase abstracta) que es lo que la fábrica <b>devuelve</b>.</li>
<li>Varias <b>clases concretas</b> que lo implementan.</li>
<li>Un <b>método creador</b> (en el parcial, <code>static crear(tipo)</code>) con <code>if</code>/<code>switch</code>. Los <code>new</code> concretos <b>solo aparecen ahí</b>.</li>
<li>El parámetro tipado con <b>unión de literales</b>: <code>"retiro" | "envio"</code>.</li></ol>
<div class="cols"><div><h4>Ventajas</h4><ul><li>Separa crear de usar (SRP).</li><li>Agregar tipos sin tocar el código que los usa.</li><li>Centraliza los <code>new</code>.</li></ul></div>
<div><h4>Desventajas</h4><ul><li><b>Más clases y más complejidad</b>.</li><li>La fábrica sí se toca al agregar un tipo (un <code>if</code> más).</li></ul></div></div>
<div class="warn"><b>Error típico</b> Hacer <code>new PedidoEnvio()</code> en el bloque de prueba. La consigna dice "fuera de la fábrica nadie usa <code>new</code>". Usá siempre <code>FabricaPedidos.crear("envio")</code>.</div>`},
{h:"4. Observer (comportamental)",html:`
<p><b>Problema</b>: cuando un objeto <b>cambia de estado</b>, <b>varios otros</b> deben enterarse <b>sin que el primero sepa quiénes son</b>. Relación <b>uno a muchos</b>.</p>
<pre class="code" data-code="pat-observer"></pre>
<ul><li><b>Sujeto</b> (Subject): guarda una <b>lista de la interfaz</b> observador, con <code>suscribir</code>, <code>desuscribir</code> y <code>notificar</code>.</li>
<li><b>Observador</b>: interfaz con un método (<code>actualizar</code>/<code>avisar</code>) que el sujeto llama.</li>
<li><b>Observadores concretos</b>: deciden qué hacer.</li>
<li>Se agregan observadores <b>sin tocar al sujeto</b> (OCP) y el sujeto depende de la interfaz (DIP).</li></ul>
<div class="cols"><div><h4>Ventajas</h4><ul><li><b>Bajo acoplamiento</b> entre quien avisa y quien escucha.</li><li>Suscribir/desuscribir en ejecución.</li></ul></div>
<div><h4>Desventajas</h4><ul><li><b>Notificaciones en cascada difíciles de seguir</b>.</li><li>Orden de aviso poco claro; fugas si nunca se desuscriben.</li></ul></div></div>
<div class="note"><b>Regla de la materia</b> Se implementa a mano. Prohibido usar <code>EventEmitter</code> de Node.</div>`},
{h:"5. Adapter (estructural)",html:`
<p><b>Problema que resuelve</b>: <b>permite que dos interfaces incompatibles trabajen juntas</b> (Tema B pregunta 7). Tenés una clase que ya funciona pero con otra interfaz, y no la podés o no la querés modificar. Como un adaptador de enchufe.</p>
<pre class="code" data-code="pat-adapter"></pre>
<ol><li><b>Target</b>: la interfaz que espera el cliente.</li>
<li><b>Adaptee</b>: la clase vieja. <b>No se modifica.</b></li>
<li><b>Adapter</b>: <code>implements</code> el target, <b>contiene</b> al adaptee (composición) y <b>traduce</b> cada llamada. No reimplementa la lógica: delega.</li></ol>
<div class="cols"><div><h4>Ventajas</h4><ul><li><b>Reutiliza sistemas viejos sin modificarlos</b>.</li><li>La traducción vive en un solo lugar.</li></ul></div>
<div><h4>Desventajas</h4><ul><li><b>Agrega una capa extra</b>.</li><li>Si las interfaces son muy distintas, la traducción se complica.</li></ul></div></div>
<div class="warn"><b>No confundir</b> "Controla que exista un único objeto que coordine el sistema" es el <b>Singleton</b>. "Notifica automáticamente a varios objetos" es el <b>Observer</b>.</div>`},
{h:"6. Cómo reconocer un patrón en código ajeno",html:`
<ol><li>¿<b>Constructor <code>private</code></b> + un <code>static</code> que devuelve la instancia? → <b>Singleton</b>.</li>
<li>¿Un método que recibe un "tipo" y <b>devuelve distintas clases concretas</b> con un tipo de retorno común? → <b>Factory</b>.</li>
<li>¿Una <b>lista de objetos de una interfaz</b> y un método que la recorre llamando al mismo método cuando algo cambia? → <b>Observer</b>.</li>
<li>¿Una clase que <b>implementa una interfaz</b> y <b>guarda adentro un objeto de otra clase</b> con métodos de nombres distintos, y solo traduce? → <b>Adapter</b>.</li></ol>
<div class="note"><b>Truco de múltiple opción</b> Las opciones incorrectas suelen ser <b>ventajas o desventajas de otro patrón</b>. Primero identificá el patrón y después elegí.</div>`},
{h:"7. Patrones combinados y trampas",html:`
<ul><li><b>Singleton + Factory</b> (parcial ejercicio 2): la clase creada por la fábrica lee el valor del Singleton.</li>
<li><b>Observer + Adapter</b> (simulacro Cine): el adapter funciona como un observador más.</li></ul>
<h4>Trampas</h4>
<ol><li>"El constructor del Singleton es protected" → no, es <b>private</b>.</li>
<li>"<code>obtenerInstancia</code> es de instancia" → no, es <b>static</b>.</li>
<li>"Factory es estructural" → no, <b>creacional</b>.</li>
<li>"El Adapter modifica la clase vieja" → justamente <b>no</b>.</li>
<li>"El sujeto del Observer conoce cada observador concreto" → no, conoce la <b>interfaz</b>.</li>
<li>Fábrica que devuelve la clase concreta (<code>crear(): PedidoEnvio</code>) → debe devolver el <b>tipo común</b>.</li>
<li>Singleton con <code>instancia</code> pública → cualquiera la reemplaza.</li></ol>`}
],
solid:[
{h:"1. Conceptos previos",html:`
<p><b>SOLID</b> son cinco principios de diseño orientado a objetos popularizados por Robert C. Martin ("Uncle Bob"). El código que los viola <b>compila y funciona</b>: lo que logran es que sea fácil de cambiar, extender y probar.</p>
<ul><li><b>Cohesión</b>: qué tan relacionadas están las cosas dentro de una clase. <b>Alta = bueno</b>.</li>
<li><b>Acoplamiento</b>: cuánto depende una clase de otras. <b>Bajo = bueno</b>.</li>
<li><b>Refactorizar</b>: cambiar la estructura interna <b>sin cambiar el comportamiento visible</b>. En el examen: <b>la salida antes y después es idéntica</b>.</li>
<li><b>Code smell</b>: señal de mal diseño (un <code>switch</code> que crece, un <code>new</code> escondido, una clase gigante).</li></ul>`},
{h:"2. S · Responsabilidad Única (SRP)",html:`
<p><b>"Una clase debe tener una sola razón para cambiar."</b> Responsabilidad = motivo de cambio, no "un solo método".</p>
<p><b>Señal</b>: una clase <b>valida, guarda y manda mails</b>. Tema A pregunta 8: "una clase User guarda sus datos en la base y además envía emails de bienvenida" → viola <b>SRP</b>.</p>
<pre class="code" data-code="solid-srp"></pre>
<p><b>Solución</b>: una clase por responsabilidad, coordinadas por <b>composición</b>. El servicio coordinador delega; no hace el trabajo.</p>`},
{h:"3. O · Abierto/Cerrado (OCP)",html:`
<p><b>"Abierto a la extensión, cerrado a la modificación."</b> Agregar comportamiento nuevo <b>sin modificar código que ya funciona y fue probado</b> (Tema B pregunta 8).</p>
<p><b>Señal</b>: un <code>switch</code> o <code>if</code> que <b>crece con cada opción nueva</b>.</p>
<pre class="code" data-code="solid-ocp"></pre>
<p><b>Solución</b>: <b>interfaz común y una clase por opción</b>; la clase original recibe la interfaz y usa polimorfismo en vez del <code>if</code>.</p>
<div class="note"><b>"Cerrado" no es "intocable"</b> Los bugs se corrigen igual. Significa que para agregar una opción no hay que tocarlo. Si queda un <code>switch</code>, que sea uno solo y aislado en una Factory.</div>`},
{h:"4. L · Sustitución de Liskov (LSP)",html:`
<p><b>"Los objetos de una subclase deben poder reemplazar a los de su clase base sin alterar el correcto funcionamiento del programa."</b> (Barbara Liskov, 1987). Tema B pregunta 9: "al reemplazar un objeto de la base por uno de su subclase el programa se comporta mal" → viola <b>LSP</b>.</p>
<pre class="code" data-code="solid-lsp"></pre>
<p>Una subclase <b>no puede</b>: exigir más (precondiciones más duras), garantizar menos, lanzar excepciones nuevas donde la base no lanzaba (<code>Pinguino.volar()</code> → <code>throw</code>), ni romper invariantes.</p>
<p><b>Solución</b>: <b>sacar la herencia y usar un contrato común</b> (interfaz) que todos cumplan de verdad. "Es un" no alcanza: tiene que "<b>comportarse como</b> un".</p>`},
{h:"5. I · Segregación de Interfaces (ISP)",html:`
<p><b>"Los clientes no deberían depender de interfaces que no usan."</b> Mejor varias interfaces chicas que una gorda. Tema A pregunta 9: "una interfaz con muchos métodos obliga a una clase a implementar métodos que nunca usa" → viola <b>ISP</b>.</p>
<pre class="code" data-code="solid-isp"></pre>
<ul><li><b>Señal</b>: métodos que hacen <code>throw</code> o quedan vacíos porque no le corresponden.</li>
<li><b>Solución</b>: partir en interfaces chicas; una clase implementa varias (<code>implements A, B, C</code>).</li>
<li><b>ISP vs LSP</b>: si el problema es una <b>herencia</b> donde la hija no cumple lo del padre → LSP. Si es una <b>interfaz demasiado grande</b> → ISP. Muchas veces la misma corrección arregla los dos.</li></ul>`},
{h:"6. D · Inversión de Dependencias (DIP)",html:`
<p><b>"Los módulos de alto nivel no deben depender de módulos de bajo nivel. Ambos deben depender de abstracciones."</b> Las clases dependen de <b>abstracciones, no de implementaciones concretas</b> (Tema A pregunta 10).</p>
<p><b>Señal</b>: un <b><code>new</code> de una clase concreta dentro de otra clase</b> ("la clase crea su propia dependencia").</p>
<pre class="code" data-code="solid-dip"></pre>
<ul><li><b>¿Por qué "inversión"?</b> Antes: Servicio → ArchivoLog. Después: Servicio → <code>Registro</code> ← ArchivoLog. La flecha del detalle apunta hacia la abstracción.</li>
<li><b>Ventaja concreta</b> (Tema B pregunta 10): <b>facilita cambiar implementaciones</b>, por ejemplo para testear con <i>mocks</i> o cambiar de proveedor. No hace el programa más rápido.</li>
<li><b>DIP</b> es el principio; <b>DI</b> (inyección por constructor) es la técnica; el <b>composition root</b> es el único lugar donde se hacen los <code>new</code> (el bloque de prueba).</li>
<li>No todo <code>new</code> viola DIP: <code>new Date()</code> o un arreglo están bien. Importa depender de un <b>servicio o infraestructura</b> concreta.</li></ul>`},
{h:"7. Tabla de señales y frases de consigna",html:`
<div class="mini"><table><thead><tr><th>Principio</th><th>Señal</th><th>Solución</th></tr></thead><tbody>
<tr><td><b>SRP</b></td><td>Una clase valida, guarda y manda mails</td><td>Una clase por responsabilidad</td></tr>
<tr><td><b>OCP</b></td><td><code>switch</code>/<code>if</code> que crece con cada opción</td><td>Interfaz común + una clase por opción</td></tr>
<tr><td><b>LSP</b></td><td>La subclase cambia lo que esperaba la base</td><td>Sacar la herencia; contrato común</td></tr>
<tr><td><b>ISP</b></td><td>Métodos con <code>throw</code> porque no corresponden</td><td>Interfaces chicas</td></tr>
<tr><td><b>DIP</b></td><td><code>new</code> de una clase concreta adentro</td><td>Recibir una interfaz por constructor</td></tr></tbody></table></div>
<ul><li>"cada opción nueva obliga a agregar otro <code>if</code>" → <b>OCP</b></li>
<li>"la clase crea su propia dependencia concreta" → <b>DIP</b></li>
<li>"hace demasiadas cosas / varios motivos para cambiar" → <b>SRP</b></li>
<li>"la subclase rompe lo que esperaba la función" → <b>LSP</b></li>
<li>"obligada a implementar métodos que no usa" → <b>ISP</b></li>
<li>"agregar un comportamiento sin modificar código probado" → <b>OCP</b></li></ul>`},
{h:"8. SOLID y los patrones",html:`
<ul><li><b>Factory</b> ayuda a SRP (separa crear de usar), OCP y DIP (el cliente depende del tipo común).</li>
<li><b>Observer</b> ayuda a OCP (nuevo observador sin tocar el sujeto) y DIP (el sujeto depende de la interfaz).</li>
<li><b>Adapter</b> ayuda a SRP (la traducción en un lugar) y OCP (integra lo viejo sin modificarlo).</li>
<li><b>Singleton</b>: ojo, puede <b>violar SRP</b> y esconder dependencias (contra DIP).</li></ul>`},
{h:"9. Receta para el ejercicio 3 (refactor)",html:`
<ol><li><b>Copiá el código original</b> en <code>src/ejercicio3.ts</code>, ejecutalo y guardá la salida.</li>
<li><b>Commit</b> <code>chore(ej3): código original</code> <b>antes de tocar nada</b>.</li>
<li>Identificá la señal y nombrá el principio (casi siempre <b>OCP + DIP</b>).</li>
<li><b>OCP</b>: creá la interfaz de las opciones (<code>MedioDePago</code>, <code>Canal</code>) y una clase por opción. El método recibe la interfaz y <b>no tiene ningún <code>if</code></b>.</li>
<li><b>DIP</b>: creá la interfaz de la dependencia (<code>Repositorio</code>, <code>Registro</code>) con sus dos implementaciones. La clase la recibe <b>por constructor</b> y la guarda en un atributo <code>private</code>.</li>
<li><b>Comentario de una línea arriba de cada interfaz nueva</b>: <code>// OCP: ...</code> y <code>// DIP: ...</code>.</li>
<li>Mové los <code>new</code> al bloque de prueba (composition root).</li>
<li>Ejecutá y compará la salida <b>carácter por carácter</b>. <code>npx tsc</code> limpio.</li>
<li><b>Commit</b> <code>refactor(ej3): ejercicio 3 completo</code>.</li></ol>
<div class="warn"><b>Error que ya te pasó</b> No envuelvas la llamada a la dependencia en otro <code>console.log</code>: si <code>escribir()</code> ya imprime y devuelve <code>void</code>, vas a ver <code>undefined</code> en la salida.</div>`}
],
exam:[
{h:"1. Qué se toma en el recuperatorio",html:`
<p>Según el aviso del profe, la práctica del recuperatorio del 1er parcial es <b>similar a los anteriores</b>: <b>3 ejercicios</b>.</p>
<ol><li><b>POO</b>: clase abstracta, herencia, polimorfismo, <code>readonly</code>, <code>private</code>, <code>static</code>, getter (Estacionamiento / Hotel).</li>
<li><b>Patrones de diseño</b>: interfaz + Singleton + Factory Method (Local de comidas / Envíos). Puede aparecer Observer o Adapter.</li>
<li><b>Principios SOLID</b>: refactor de un código que funciona, casi siempre OCP + DIP (Cobros / Notificaciones).</li></ol>
<ul><li><b>Teoría</b> (40 %): 10 preguntas de opción múltiple, 1 hora. <b>Se aprueba con 6</b>. Si no aprobás la teoría, <b>la práctica no se corrige</b>.</li>
<li><b>Práctica</b> (60 %): 1,5 horas en la PC. <b>Se aprueba resolviendo bien 2 de 3</b>.</li></ul>`},
{h:"2. Armar el proyecto (minuto 0 a 5)",html:`
<pre class="code" data-code="exam-setup"></pre>
<p><code>tsconfig.json</code> con las opciones exactas de la consigna:</p>
<pre class="code" data-code="exam-tsconfig"></pre>
<ul><li><code>.gitignore</code> con la línea <code>node_modules/</code>.</li>
<li><code>ENTREGA.md</code> con apellido, nombre, DNI, tema y URL del repositorio.</li>
<li>Estructura: <code>src/ejercicio1.ts</code>, <code>src/ejercicio2.ts</code>, <code>src/ejercicio3.ts</code>.</li></ul>`},
{h:"3. Git: puntos de control",html:`
<p>Repositorio <b>privado</b> <code>parcial-tlp4-apellido</code> con los <b>cuatro profesores</b> como colaboradores (Settings → Collaborators). Si es público o falta alguno, no se corrige.</p>
<div class="mini"><table><thead><tr><th>#</th><th>Momento</th><th>Mensaje exacto</th></tr></thead><tbody>
<tr><td>0</td><td>Proyecto configurado y <code>npx tsc</code> corriendo</td><td><code>chore: configuración inicial</code></td></tr>
<tr><td>1</td><td>Ejercicio 1 terminado</td><td><code>feat(ej1): ejercicio 1 completo</code></td></tr>
<tr><td>2</td><td>Ejercicio 2 terminado</td><td><code>feat(ej2): ejercicio 2 completo</code></td></tr>
<tr><td>3</td><td>Original del ej. 3, antes de refactorizar</td><td><code>chore(ej3): código original</code></td></tr>
<tr><td>4</td><td>Ejercicio 3 terminado</td><td><code>refactor(ej3): ejercicio 3 completo</code></td></tr>
<tr><td>5</td><td><code>ENTREGA.md</code> final</td><td><code>docs: entrega final</code></td></tr></tbody></table></div>
<pre class="code" data-code="exam-git"></pre>
<div class="warn"><b>Sin commit, no existe</b> Un ejercicio sin su commit de control se considera no entregado. Solo cuenta lo que está en <code>main</code> en GitHub antes de la hora.</div>`},
{h:"4. Estrategia de 90 minutos",html:`
<div class="mini"><table><thead><tr><th>Minutos</th><th>Qué hacer</th></tr></thead><tbody>
<tr><td>0–5</td><td>Proyecto + <code>npx tsc</code> + commit 0</td></tr>
<tr><td>5–10</td><td>Leer los <b>tres</b> enunciados. Empezar por el que más seguro te sale</td></tr>
<tr><td>10–35</td><td>Primer ejercicio → probar → commit</td></tr>
<tr><td>35–60</td><td>Segundo ejercicio → probar → commit</td></tr>
<tr><td>60–80</td><td>Tercero (o completar el que falte)</td></tr>
<tr><td>80–90</td><td><code>npx tsc</code>, comparar salidas, <code>ENTREGA.md</code>, commit final y push</td></tr></tbody></table></div>
<div class="note"><b>Prioridad</b> Mejor <b>2 completos y prolijos</b> que 3 a medias. El ejercicio 2 (Singleton + Factory) es casi siempre igual: es el más rápido de asegurar.</div>`},
{h:"5. Diccionario: frase de la consigna → código",html:`
<div class="mini"><table><thead><tr><th>Frase</th><th>Lo que escribís</th></tr></thead><tbody>
<tr><td>"clase abstracta X con método abstracto y()"</td><td><code>abstract class X { abstract y(): T; }</code></td></tr>
<tr><td>"<code>patente</code> readonly, se recibe en el constructor"</td><td><code>readonly patente: string;</code> + asignar en el constructor</td></tr>
<tr><td>"arreglo privado"</td><td><code>private lista: X[] = [];</code></td></tr>
<tr><td>"atributo static que cuente…"</td><td><code>static total = 0;</code> y <code>Clase.total++</code></td></tr>
<tr><td>"getter <code>cantidad</code>"</td><td><code>get cantidad(): number { return this.lista.length; }</code></td></tr>
<tr><td>"sin <code>if</code> por tipo"</td><td>Polimorfismo: llamar al método de cada objeto</td></tr>
<tr><td>"Singleton X"</td><td><code>private static instancia</code> + <code>private constructor</code> + <code>static obtenerInstancia()</code></td></tr>
<tr><td>"leído del Singleton"</td><td><code>X.obtenerInstancia().valor</code>, nunca el número suelto</td></tr>
<tr><td>"Factory con <code>crear(tipo: "a" | "b")</code>"</td><td><code>static crear(tipo: "a" | "b"): Interfaz</code></td></tr>
<tr><td>"fuera de la fábrica nadie usa <code>new</code>"</td><td>En el bloque de prueba solo <code>Fabrica.crear(...)</code></td></tr>
<tr><td>"cada opción nueva agrega otro <code>if</code>"</td><td>OCP: interfaz + una clase por opción</td></tr>
<tr><td>"la clase crea su propia dependencia"</td><td>DIP: interfaz + recibir por constructor</td></tr>
<tr><td>"comentario arriba de cada interfaz"</td><td><code>// OCP: ...</code> / <code>// DIP: ...</code></td></tr></tbody></table></div>`},
{h:"6. Errores que más puntos cuestan",html:`
<ol><li><b>Salida distinta</b> por una tilde, un espacio o un <code>$</code>: copiá los textos de la consigna.</li>
<li>Olvidar el <b>commit del original</b> antes del refactor.</li>
<li><b>Parameter properties</b> por costumbre: con <code>erasableSyntaxOnly</code> no compila.</li>
<li><code>enum</code> para los tipos de la fábrica.</li>
<li><code>instanceof</code> en el recorrido polimórfico.</li>
<li>El número escrito a mano en vez de leerlo del Singleton.</li>
<li><code>new</code> de una clase concreta fuera de la fábrica.</li>
<li>Falta el <b>comentario del principio</b> arriba de cada interfaz del ej. 3.</li>
<li><code>this.total</code> en vez de <code>Clase.total</code>.</li>
<li>Entregar sin correr <code>npx tsc</code>.</li></ol>`},
{h:"7. Revisión de tu parcial (Tema B)",html:`
<p><b>Teoría: 5 de 10.</b> Hacían falta 6, por eso la práctica no se corrigió. Los cinco errores son todos de <b>identificar el concepto por su descripción</b>:</p>
<div class="mini"><table><thead><tr><th>#</th><th>Pregunta</th><th>Marcaste</th><th>Correcta</th></tr></thead><tbody>
<tr><td>3</td><td>Un atributo <code>static</code>…</td><td class="badc">a) es de cada instancia</td><td class="okc">b) pertenece a la clase y es compartido</td></tr>
<tr><td>5</td><td>Cada empleado responde <code>calcularSueldo()</code> a su manera</td><td class="badc">a) Encapsulamiento</td><td class="okc">c) Polimorfismo</td></tr>
<tr><td>7</td><td>¿Qué resuelve el Adapter?</td><td class="badc">c) Un único objeto coordinador (eso es Singleton)</td><td class="okc">a) Que interfaces incompatibles trabajen juntas</td></tr>
<tr><td>8</td><td>Agregar comportamiento sin modificar código probado</td><td class="badc">a) SRP</td><td class="okc">c) OCP</td></tr>
<tr><td>9</td><td>La subclase rompe el programa al reemplazar a la base</td><td class="badc">c) DIP</td><td class="okc">b) LSP</td></tr></tbody></table></div>
<p>Bien: 1 (versión local), 2 (<code>noEmit</code>), 4 (<code>readonly</code>), 6 (Factory), 10 (abstracciones).</p>
<h4>Práctica (lo que tenías en el repo)</h4>
<ul><li><b>Ejercicio 1</b>: bien resuelto. Detalle: los dos <code>console.log</code> de totales estaban adentro de <code>mostrarPrecios</code>; mejor dejarlos en el bloque de prueba, como pide la consigna.</li>
<li><b>Ejercicio 2</b>: el archivo estaba vacío. Es el ejercicio más mecánico: practicalo hasta escribirlo en 15 minutos.</li>
<li><b>Ejercicio 3</b>: la estructura OCP + DIP estaba bien, pero faltaban los comentarios de principio y la salida imprimía <code>undefined</code>:</li></ul>
<pre class="code" data-code="tu-bug"></pre>
<div class="note"><b>Plan</b> En el Quiz usá "Preguntas reales de los parciales" hasta sacar 20/20, y en Práctica resolvé los cuatro exámenes con el cronómetro.</div>`}
]

{u:"poo",src:"B",q:"En el tsconfig.json, ¿qué hace la opción <code>noEmit: true</code>?",o:["Desactiva todos los mensajes de error del compilador","Impide que el archivo se pueda ejecutar con node","Hace que tsc solo verifique los tipos, sin generar archivos .js"],a:2,e:"No emite salida: solo chequea."},
{u:"poo",src:"B",q:"Un atributo declarado como <code>static</code>:",o:["Pertenece a cada instancia por separado","Pertenece a la clase y es compartido por todas sus instancias","No puede modificarse una vez asignado"],a:1,e:"\"No puede modificarse\" describe a <code>readonly</code>. <code>static</code> es de la clase (<code>Hotel.totalCheckIns</code>)."},
{u:"poo",src:"B",q:"¿Qué impide el modificador <code>readonly</code> en una propiedad?",o:["Que se reasigne después del constructor, incluso desde dentro de la clase","Que se lea desde fuera de la clase","Que las subclases hereden esa propiedad"],a:0,e:"Se asigna una vez (al declarar o en el constructor) y se puede leer libremente."},
{u:"poo",src:"B",q:"Se recorre una lista de Empleado llamando a <code>calcularSueldo()</code> y cada objeto responde con su propio cálculo, sin que el código sepa de qué tipo es cada uno. ¿Qué pilar de la POO se aplica?",o:["Encapsulamiento","Abstracción","Polimorfismo"],a:2,e:"Mismo mensaje, distinto comportamiento según el objeto real = polimorfismo."},
{u:"pat",src:"B",q:"¿Cuál es la idea central del patrón Factory Method?",o:["Asegurar que una clase tenga una única instancia","Delegar la creación de objetos a una fábrica en lugar de usar new directamente","Permitir que dos interfaces incompatibles trabajen juntas"],a:1,e:"La a) es Singleton y la c) es Adapter."},
{u:"pat",src:"B",q:"¿Qué problema resuelve el patrón Adaptador?",o:["Permite que dos interfaces incompatibles trabajen juntas","Notifica automáticamente a varios objetos cuando otro cambia de estado","Controla que exista un único objeto que coordine el sistema"],a:0,e:"La b) es Observer y la c) es Singleton."},
{u:"solid",src:"B",q:"Se necesita agregar un nuevo tipo de comportamiento sin modificar código que ya funciona y fue probado. ¿Qué principio SOLID lo plantea?",o:["Responsabilidad Única (SRP)","Sustitución de Liskov (LSP)","Abierto/Cerrado (OCP)"],a:2,e:"Abierto a la extensión, cerrado a la modificación."},
{u:"solid",src:"B",q:"Si al reemplazar un objeto de la clase base por uno de su subclase el programa empieza a comportarse de forma incorrecta, ¿qué principio se viola?",o:["Segregación de Interfaz (ISP)","Sustitución de Liskov (LSP)","Inversión de Dependencia (DIP)"],a:1,e:"Liskov habla exactamente de sustituir la base por la subclase."},
{u:"solid",src:"B",q:"¿Qué ventaja concreta da depender de abstracciones en lugar de clases concretas?",o:["Facilita cambiar implementaciones, por ejemplo para testear con mocks o cambiar de proveedor","Hace que el programa se ejecute más rápido","Elimina la necesidad de usar interfaces"],a:0,e:"Es la razón práctica del DIP."},

{u:"poo",q:"Si el padre declara <code>nombre</code> como <code>private</code>, ¿la hija puede leer <code>this.nombre</code>?",o:["No: hay que declararlo protected","Sí, siempre","Solo si es readonly","Solo con override"],a:0,e:"private = solo la propia clase."},
{u:"poo",q:"Si <code>enum</code> está prohibido, ¿cómo representás un conjunto fijo de opciones?",o:["Una unión de literales como \"retiro\" | \"envio\"","Un parámetro any","Un arreglo de any","Una clase abstracta vacía"],a:0,e:"Un valor mal escrito no compila, igual que con un enum."},
{u:"poo",q:"¿Cuál es la diferencia entre abstracción y encapsulamiento?",o:["Abstracción: qué modelo y muestro; encapsulamiento: cómo protejo el estado","Son lo mismo","Abstracción es usar private; encapsulamiento es usar abstract","Abstracción es heredar"],a:0,e:"Pregunta clásica de teoría."},
{u:"poo",q:"¿Qué se puede hacer con una clase abstracta?",o:["Tener métodos con código y métodos abstractos, pero no instanciarla","Instanciarla con new","Extender varias a la vez","Solo declarar firmas, sin código"],a:0,e:"Es un molde parcial."},
{u:"poo",q:"¿Cuántas clases puede extender y cuántas interfaces puede implementar una clase?",o:["Una clase; varias interfaces","Varias clases; una interfaz","Una y una","Ninguna restricción"],a:0,e:"Herencia simple, implementación múltiple."},
{u:"poo",q:"¿Cómo se accede a un atributo static dentro de un método de instancia?",o:["Con el nombre de la clase: Hotel.totalCheckIns","Con this.totalCheckIns","Con super.totalCheckIns","No se puede"],a:0,e:"El static es de la clase, no del objeto."},
{u:"poo",q:"Un setter <code>set edad(v)</code> asigna <code>this.edad = v</code>. ¿Qué pasa?",o:["Se llama a sí mismo infinitamente (stack overflow)","Funciona normalmente","El atributo pasa a ser readonly","Error de compilación siempre"],a:0,e:"El atributo de respaldo debe llamarse distinto: <code>_edad</code>."},
{u:"poo",q:"Override vs overload:",o:["Override: la hija redefine un método heredado; overload: varias firmas del mismo nombre en la misma clase","Son sinónimos","Override solo existe en interfaces","Overload es redefinir en la hija"],a:0,e:"Sobrescritura vs sobrecarga."},
{u:"poo",q:"¿Cuál es la señal de que usaste bien el polimorfismo en <code>mostrarPrecios</code>?",o:["No hay ningún if/switch/instanceof preguntando el tipo","Hay un instanceof por cada subclase","Todas las clases son static","Se usa any para recorrer"],a:0,e:"Cada objeto responde con su propia versión."},
{u:"poo",q:"Un método devuelve <code>this.lista</code> (un arreglo privado). ¿Qué problema hay?",o:["Rompe el encapsulamiento: quien lo recibe puede modificar el arreglo real","Ninguno, porque es private","No compila","Hace una copia profunda"],a:0,e:"Devolvé <code>[...this.lista]</code>."},
{u:"poo",q:"En un diagrama UML, una flecha con triángulo vacío y línea continua indica…",o:["Herencia (extends)","Composición","Implementación de interfaz","Agregación"],a:0,e:"Línea punteada + triángulo = implements; rombo lleno = composición."},
{u:"poo",q:"<code>readonly items: string[]</code>, ¿permite hacer <code>this.items.push(\"x\")</code>?",o:["Sí: readonly protege la referencia, no el contenido","No, nunca","Solo dentro del constructor","Solo si es static"],a:0,e:"Para proteger el contenido: <code>readonly string[]</code>."},

{u:"pat",q:"¿A qué categoría pertenece el Adapter?",o:["Estructural","Creacional","Comportamental","Arquitectónico"],a:0,e:"Conecta estructuras incompatibles."},
{u:"pat",q:"¿A qué categoría pertenecen Singleton y Factory Method?",o:["Creacionales","Estructurales","Comportamentales","Uno creacional y otro estructural"],a:0,e:"Los dos se ocupan de cómo se crean objetos."},
{u:"pat",q:"¿Por qué <code>obtenerInstancia()</code> es static?",o:["Porque se llama antes de que exista una instancia","Para que sea más rápido","Porque es privado","Porque devuelve void"],a:0,e:"Sin static necesitarías un objeto para pedir el objeto."},
{u:"pat",q:"¿Cuál es una desventaja del Singleton?",o:["Dificulta las pruebas unitarias","Agrega una capa extra","Notificaciones en cascada difíciles de seguir","Obliga a crear muchas clases"],a:0,e:"Las otras son de Adapter, Observer y Factory."},
{u:"pat",q:"¿Cuál es una desventaja del Observer?",o:["Notificaciones en cascada difíciles de seguir","Dificulta las pruebas unitarias","Agrega una capa extra","No permite agregar observadores"],a:0,e:"Truco: las otras opciones son desventajas de otros patrones."},
{u:"pat",q:"¿Cuál es una desventaja del Adapter?",o:["Agrega una capa extra","Problemas en entornos concurrentes","Cascadas de notificaciones","Obliga a modificar la clase vieja"],a:0,e:"Una indirección más."},
{u:"pat",q:"¿Cuál es una desventaja del Factory Method?",o:["Más clases y más complejidad","Dificulta las pruebas unitarias","Agrega estado global","Modifica la clase vieja"],a:0,e:"Para dos tipos simples puede ser exagerado."},
{u:"pat",q:"¿Qué tipo de retorno debe tener <code>FabricaEnvios.crear(tipo)</code>?",o:["El tipo común: la interfaz Envio","EnvioExpress","any","void"],a:0,e:"Quien usa solo conoce el tipo común."},
{u:"pat",q:"En el Observer, el sujeto conoce…",o:["Solo la interfaz Observador","Cada clase concreta de observador","Nada, usa EventEmitter","Al adaptee"],a:0,e:"Por eso se agregan observadores sin tocarlo."},
{u:"pat",q:"En el Adapter, ¿qué pasa con la clase vieja (adaptee)?",o:["No se modifica: el adapter la contiene y traduce","Se reescribe entera","Se borra","Pasa a ser Singleton"],a:0,e:"Reutilizar sin modificar es la gracia del patrón."},
{u:"pat",q:"<code>PedidoEnvio</code> hace <code>return subtotal + 1500;</code>. ¿Qué está mal?",o:["El valor tiene que leerse del Singleton, no escribirse a mano","Nada","Debería ser static","Debería usar enum"],a:0,e:"<code>ConfiguracionLocal.obtenerInstancia().costoEnvio</code>."},

{u:"pat",q:"Una clase implementa <code>Suscriptor</code> y adentro guarda un <code>SistemaPushViejo</code>, traduciendo <code>avisar</code> a <code>mandarPush</code>. ¿Qué patrón es?",o:["Adapter","Observer","Factory","Singleton"],a:0,e:"Implementa la interfaz nueva y contiene la vieja."},
