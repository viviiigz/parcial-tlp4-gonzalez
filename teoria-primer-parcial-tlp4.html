/* ---------------- STATE ---------------- */
const store = {
  get(k,d){try{const v=localStorage.getItem("tlp4p1:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("tlp4p1:"+k,JSON.stringify(v))}catch(e){}}
};
const S = {unit:store.get("unit","all"), tab:store.get("tab","resumen"), set:store.get("set","all")};
let known = new Set(store.get("known",[]));
const cardId = c => c[0]+":"+c[1];
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const inUnit = u => S.unit==="all" || S.unit===u;
const $ = (s,el=document) => el.querySelector(s);
const view = $("#view");
const badge = u => `<span class="ubadge" style="--c:${UNITS[u].c}">${UNITS[u].name}</span>`;
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* resaltado mínimo de TypeScript */
const KW = /^(abstract|break|case|catch|class|const|constructor|else|export|extends|for|function|get|if|implements|import|interface|let|new|of|override|private|protected|public|readonly|return|set|static|super|switch|this|throw|try|type|void|number|string|boolean|unknown|undefined|true|false|null)$/;
function highlight(src, lang){
  if(lang==="sh") return esc(src);
  const re=/(\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|([A-Za-z_]\w*)|(\d+(?:\.\d+)?)/g;
  let out="",last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    if(m[1])out+=`<span class="tk-c">${esc(m[1])}</span>`;
    else if(m[2])out+=`<span class="tk-s">${esc(m[2])}</span>`;
    else if(m[3])out+=KW.test(m[3])?`<span class="tk-k">${m[3]}</span>`:m[3];
    else out+=`<span class="tk-n">${m[4]}</span>`;
    last=re.lastIndex;
  }
  return out+esc(src.slice(last));
}
const rawCode = id => {const el=document.getElementById("c-"+id);return el?el.textContent.replace(/^\n/,"").replace(/\s+$/,""):""};
function fillCode(root){
  root.querySelectorAll("pre[data-code]").forEach(p=>{
    const id=p.dataset.code, el=document.getElementById("c-"+id);
    p.innerHTML=highlight(rawCode(id), el&&el.dataset.lang);
  });
}
const codeBlock = id => `<div class="code-wrap"><pre class="code" data-code="${id}"></pre><button class="btn sm copy" data-copy="${id}">Copiar</button></div>`;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");if(!b)return;
  const t=rawCode(b.dataset.copy);
  const done=()=>{b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar",1200)};
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>{});
});

/* header */
function renderUnits(){
  const opts=[["all","Todas","var(--fg)"],...Object.entries(UNITS).map(([k,v])=>[k,v.name,v.c])];
  $("#units").innerHTML=opts.map(([k,n,c])=>`<button class="chip" style="--c:${c}" data-unit="${k}" aria-pressed="${S.unit===k}"><span class="dot"></span>${n}</button>`).join("");
}
$("#units").addEventListener("click",e=>{const b=e.target.closest("[data-unit]");if(!b)return;S.unit=b.dataset.unit;store.set("unit",S.unit);fc=null;qz=null;renderUnits();render()});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;store.set("tab",S.tab);render()});

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===S.tab));
  ({resumen:renderSummary,cards:renderCards,quiz:renderQuiz,tablas:renderTables,practica:renderPractice})[S.tab]();
  fillCode(view);
}

/* resumen */
function renderSummary(){
  const units=Object.keys(UNITS).filter(inUnit);
  view.innerHTML=`<div class="notice"><span class="eyebrow">Aviso del profe · recuperatorio</span>
    <p>La práctica es similar a la de los parciales: <b>3 ejercicios</b>.</p>
    <ol><li><b>POO</b></li><li><b>Patrones de diseño</b></li><li><b>Principios S.O.L.I.D.</b></li></ol>
    <p class="stats">Teoría: 10 preguntas, se aprueba con 6 · Práctica: 2 de 3 ejercicios</p></div>
  <div class="sum-tools"><input id="q" type="search" placeholder="Buscar en la teoría (ej.: static, adapter, liskov)" aria-label="Buscar en la teoría"><button class="btn" id="openAll">Abrir todo</button><button class="btn" id="closeAll">Cerrar todo</button></div><p class="stats" id="qinfo" hidden></p>`+
  units.map(u=>`<section class="unit-block" style="--c:${UNITS[u].c}">
    <div class="unit-head">${badge(u)}<h2>${UNITS[u].full}</h2><p>${UNITS[u].desc}</p></div>
    <nav class="toc" aria-label="Índice de ${UNITS[u].name}">${SUMMARY[u].map((s,i)=>`<a href="#" data-go="${u}-${i}">${s.h}</a>`).join("")}</nav>
    ${SUMMARY[u].map((s,i)=>`<details class="sec" id="sec-${u}-${i}" open><summary>${s.h}</summary><div class="sec-body prose">${s.html}</div></details>`).join("")}
  </section>`).join("");
  $("#openAll").onclick=()=>view.querySelectorAll("details").forEach(d=>d.open=true);
  $("#closeAll").onclick=()=>view.querySelectorAll("details").forEach(d=>d.open=false);
  view.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();const d=$("#sec-"+a.dataset.go);d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})});
  const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  $("#q").oninput=e=>{const q=norm(e.target.value.trim());let n=0;
    view.querySelectorAll("details.sec").forEach(d=>{const hit=!q||norm(d.textContent).includes(q);d.hidden=!hit;if(hit){n++;if(q)d.open=true}});
    view.querySelectorAll(".unit-block").forEach(b=>b.hidden=q&&!b.querySelector("details.sec:not([hidden])"));
    view.querySelectorAll(".toc").forEach(t=>t.hidden=!!q);
    const i=$("#qinfo");i.hidden=!q;i.textContent=n?`${n} secciones mencionan «${e.target.value.trim()}»`:`Ninguna sección menciona «${e.target.value.trim()}». Probá con otra palabra.`};
}

/* flashcards */
let fc=null;
function buildDeck(onlyPending){
  let d=CARDS.filter(c=>inUnit(c[0]));
  if(onlyPending)d=d.filter(c=>!known.has(cardId(c)));
  return {deck:shuffle(d),i:0,flipped:false,pending:onlyPending};
}
function renderCards(){
  if(!fc)fc=buildDeck(store.get("pendingOnly",false));
  const all=CARDS.filter(c=>inUnit(c[0]));
  const k=all.filter(c=>known.has(cardId(c))).length;
  const pct=all.length?Math.round(k/all.length*100):0;
  let body;
  if(!fc.deck.length || fc.i>=fc.deck.length){
    body=`<div class="empty"><h2>${fc.deck.length?"Terminaste la ronda":"No quedan tarjetas pendientes"}</h2>
      <p class="stats">${k} de ${all.length} marcadas como sabidas</p>
      <div class="row"><button class="btn primary" id="again">Barajar de nuevo</button>${k?`<button class="btn" id="pend">Solo las que me faltan</button>`:""}<button class="btn" id="reset">Reiniciar progreso</button></div></div>`;
  } else {
    const c=fc.deck[fc.i], isK=known.has(cardId(c));
    body=`<div class="card ${fc.flipped?"flipped":""}" id="card" tabindex="0" role="button" aria-label="Dar vuelta la tarjeta">
      <div class="card-in">
        <div class="face front"><div class="top-line">${badge(c[0])}<span class="hint">${fc.i+1} / ${fc.deck.length}</span></div><div class="q">${c[1]}</div><div class="top-line"><span class="hint">Tocá para ver la respuesta</span>${isK?'<span class="known-mark">✓ sabida</span>':""}</div></div>
        <div class="face back"><div class="top-line">${badge(c[0])}<span class="hint">Respuesta</span></div><div class="a">${c[2]}</div><div class="hint">${c[1]}</div></div>
      </div></div>
      <div class="fc-actions">
        <button class="btn nav" id="prev" aria-label="Anterior">←</button>
        <button class="btn bad" id="no">Repasar</button>
        <button class="btn ok" id="yes">La sabía</button>
        <button class="btn nav" id="next" aria-label="Siguiente">→</button>
      </div>
      <p class="kbd">Espacio: girar · ← →: navegar · 1: repasar · 2: la sabía</p>`;
  }
  view.innerHTML=`<div class="fc-bar"><div class="row"><span class="eyebrow">Progreso</span><span class="stats">${k}/${all.length} · ${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div>
    <div class="row"><button class="chip" id="toggleP" aria-pressed="${fc.pending}">Solo pendientes</button><button class="chip" id="shuf">Barajar</button></div></div>`+body;
  const card=$("#card");
  if(card){card.onclick=flip;$("#prev").onclick=()=>move(-1);$("#next").onclick=()=>move(1);$("#yes").onclick=()=>mark(true);$("#no").onclick=()=>mark(false)}
  $("#toggleP").onclick=()=>{const p=!fc.pending;store.set("pendingOnly",p);fc=buildDeck(p);renderCards()};
  $("#shuf").onclick=()=>{fc=buildDeck(fc.pending);renderCards()};
  const ag=$("#again");if(ag)ag.onclick=()=>{fc=buildDeck(fc.pending);renderCards()};
  const pe=$("#pend");if(pe)pe.onclick=()=>{store.set("pendingOnly",true);fc=buildDeck(true);renderCards()};
  const rs=$("#reset");if(rs)rs.onclick=()=>{all.forEach(c=>known.delete(cardId(c)));store.set("known",[...known]);fc=buildDeck(false);store.set("pendingOnly",false);renderCards()};
}
function flip(){fc.flipped=!fc.flipped;const c=$("#card");if(c)c.classList.toggle("flipped",fc.flipped)}
function move(d){fc.i=Math.max(0,Math.min(fc.deck.length,fc.i+d));fc.flipped=false;renderCards()}
function mark(ok){const id=cardId(fc.deck[fc.i]);ok?known.add(id):known.delete(id);store.set("known",[...known]);move(1)}
document.addEventListener("keydown",e=>{
  if(S.tab!=="cards"||!fc||!$("#card")||e.target.closest("input,textarea"))return;
  if(e.key===" "){e.preventDefault();flip()} else if(e.key==="ArrowRight")move(1); else if(e.key==="ArrowLeft")move(-1);
  else if(e.key==="1")mark(false); else if(e.key==="2")mark(true);
});

/* quiz */
let qz=null;
const srcBadge = q => q.src?`<span class="srcbadge">Salió en el parcial · Tema ${q.src}</span>`:"";
function startQuiz(mode,n){
  const base=QUIZ.filter(q=>inUnit(q.u));
  let pool;
  if(mode==="real") pool=shuffle(base.filter(q=>q.src));
  else if(mode==="sim"){ // simulacro: 10 preguntas mezclando unidades, como la teoría real
    const by=u=>shuffle(base.filter(q=>q.u===u));
    pool=S.unit==="all"?shuffle([...by("poo").slice(0,4),...by("pat").slice(0,3),...by("solid").slice(0,3)]):shuffle(base).slice(0,10);
  } else pool=shuffle(base).slice(0,n);
  qz={mode,qs:pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}}),i:0,picked:null,score:0,miss:[]};
  renderQuiz();fillCode(view);
}
function renderQuiz(){
  const pool=QUIZ.filter(q=>inUnit(q.u)), real=pool.filter(q=>q.src);
  const hk="hist:"+S.unit, hist=store.get(hk,[]);
  if(!qz){
    const label=S.unit==="all"?"todas las unidades":UNITS[S.unit].full;
    view.innerHTML=`<div class="qz-card qz-setup"><span class="eyebrow">Quiz de opción múltiple</span><h2>Ponete a prueba con ${label}</h2>
      <p>Hay ${pool.length} preguntas en el banco (${real.length} son de las teorías reales). Las opciones se mezclan en cada ronda y cada respuesta trae su explicación.</p>
      <h3>Simulacro de la teoría</h3>
      <div class="row"><button class="btn primary" data-mode="sim">Simulacro: 10 preguntas · aprobás con 6</button>${real.length?`<button class="btn" data-mode="real">Preguntas reales de los parciales (${real.length})</button>`:""}</div>
      <h3>Práctica libre</h3>
      <div class="row">${[10,25].filter(n=>n<pool.length).map(n=>`<button class="btn" data-n="${n}">${n} preguntas</button>`).join("")}<button class="btn" data-n="${pool.length}">Todas (${pool.length})</button></div>
      ${hist.length?`<p class="hist">Últimos resultados: ${hist.slice(-5).map(h=>`${h.s}/${h.t}`).join(" · ")}</p>`:""}</div>`;
    view.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>startQuiz("free",+b.dataset.n));
    view.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.mode));
    return;
  }
  if(qz.i>=qz.qs.length){
    const t=qz.qs.length,s=qz.score,p=t?Math.round(s/t*100):0, pass=p>=60;
    if(!qz.saved){hist.push({s,t});store.set(hk,hist.slice(-20));qz.saved=true}
    view.innerHTML=`<div class="qz-card"><span class="eyebrow">Resultado</span>
      <div class="row" style="gap:16px;align-items:baseline"><span class="score-big" style="color:${pass?"var(--ok)":"var(--bad)"}">${s}/${t}</span><span class="stats">${p}% · ${pass?"Aprobado (6 de 10 o más)":"No alcanza: hacen falta 6 de 10"}</span></div>
      ${qz.miss.length?`<div><b>Para repasar</b><div class="miss">${qz.miss.map(q=>`<div>${badge(q.u)} ${srcBadge(q)}<b>${q.q}</b>Correcta: ${q.o[q.a]}<br><span class="stats">${q.e}</span></div>`).join("")}</div></div>`:"<p>Ningún error. Muy bien.</p>"}
      <div class="row"><button class="btn primary" id="retry">Otra ronda</button><button class="btn" id="back">Cambiar modo</button></div></div>`;
    $("#retry").onclick=()=>startQuiz(qz.mode,t);$("#back").onclick=()=>{qz=null;renderQuiz()};
    return;
  }
  const q=qz.qs[qz.i],L="ABCD";
  view.innerHTML=`<div class="qz-card" style="--c:${UNITS[q.u].c}">
    <div class="qz-foot"><div class="row">${badge(q.u)} ${srcBadge(q)}</div><span class="stats">Pregunta ${qz.i+1} de ${qz.qs.length} · ${qz.score} correctas</span></div>
    <div class="qz-q">${q.q}</div>
    <div class="opts">${q.o.map((o,i)=>{let cl="";if(qz.picked!=null){if(i===q.a)cl="right";else if(i===qz.picked)cl="wrong"}
      return `<button class="opt ${cl}" data-i="${i}" ${qz.picked!=null?"disabled":""}><span class="k">${L[i]}</span><span>${o}</span></button>`}).join("")}</div>
    ${qz.picked!=null?`<div class="expl"><b>${qz.picked===q.a?"Correcto.":"Incorrecto."}</b> ${q.e}</div>
    <div class="qz-foot"><button class="btn" id="quit">Terminar</button><button class="btn primary" id="nextQ">${qz.i+1<qz.qs.length?"Siguiente":"Ver resultado"} →</button></div>`:""}
  </div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(qz.picked!=null)return;qz.picked=+b.dataset.i;if(qz.picked===q.a)qz.score++;else qz.miss.push(q);renderQuiz();const n=$("#nextQ");if(n)n.focus()});
  const n=$("#nextQ");if(n)n.onclick=()=>{qz.i++;qz.picked=null;renderQuiz()};
  const qu=$("#quit");if(qu)qu.onclick=()=>{qz.qs=qz.qs.slice(0,qz.i+1);qz.i=qz.qs.length;renderQuiz()};
}
document.addEventListener("keydown",e=>{
  if(S.tab!=="quiz"||!qz||qz.i>=qz.qs.length)return;
  const m={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3}[e.key.toLowerCase()];
  if(m!=null&&qz.picked==null){const b=view.querySelectorAll(".opt")[m];if(b)b.click()}
  else if(e.key==="Enter"&&qz.picked!=null&&document.activeElement?.id!=="nextQ"){const n=$("#nextQ");if(n)n.click()}
});

/* tablas */
function renderTables(){
  view.innerHTML=TABLES.filter(t=>inUnit(t.u)).map(t=>`<section class="tbl-block">${badge(t.u)}<h3>${t.h}</h3><div class="tbl-scroll"><table>
    <thead><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?"<b>"+esc(c)+"</b>":esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div></section>`).join("");
}

/* práctica */
let timerId=null;
const EXAM_MS=90*60*1000;
function fmt(ms){const neg=ms<0;ms=Math.abs(ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return (neg?"-":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function tick(){
  const el=$("#timer");if(!el){clearInterval(timerId);timerId=null;return}
  const start=store.get("timerStart",null);
  if(start==null){el.textContent="90:00";el.classList.remove("late");return}
  const left=EXAM_MS-(Date.now()-start);
  el.textContent=fmt(left);el.classList.toggle("late",left<10*60*1000);
}
function renderPractice(){
  const sets=Object.keys(SETS);
  const list=EXERCISES.filter(x=>inUnit(x.u)&&(S.set==="all"||S.set===x.set));
  const done=store.get("done",{}), checks=store.get("checks",{});
  const total=EXERCISES.filter(x=>inUnit(x.u)).length, nDone=EXERCISES.filter(x=>inUnit(x.u)&&done[x.id]).length;
  const running=store.get("timerStart",null)!=null;
  view.innerHTML=`<div class="pr-bar">
    <div class="timer-box"><div><span class="eyebrow">Cronómetro de examen</span><div class="timer" id="timer">90:00</div></div>
      <div class="row"><button class="btn ${running?"":"primary"}" id="tStart">${running?"Reiniciar":"Empezar 1:30 h"}</button>${running?`<button class="btn" id="tStop">Detener</button>`:""}</div></div>
    <div class="row" role="group" aria-label="Examen"><button class="chip" data-set="all" aria-pressed="${S.set==="all"}">Todos</button>${sets.map(k=>`<button class="chip" data-set="${k}" aria-pressed="${S.set===k}">${SETS[k]}</button>`).join("")}</div>
    <div class="row"><span class="eyebrow">Resueltos solo</span><span class="stats">${nDone}/${total}</span><div class="progress"><i style="width:${total?Math.round(nDone/total*100):0}%"></i></div></div>
  </div>`+
  (list.length?list.map(x=>{const ck=checks[x.id]||[];return `<article class="ex-card" style="--c:${UNITS[x.u].c}" id="ex-${x.id}">
    <div class="ex-head"><div class="row">${badge(x.u)}<span class="srcbadge">${SETS[x.set]} · Ej. ${x.id[1]}</span></div>${done[x.id]?'<span class="done-mark">✓ resuelto solo</span>':""}</div>
    <h3>${x.title}</h3><p class="temas">${x.temas}</p>
    <div class="prose">${x.html}</div>
    ${x.orig?codeBlock(x.orig):""}
    ${x.html2?`<div class="prose">${x.html2}</div>`:""}
    <div><span class="eyebrow">Salida esperada</span><pre class="out">${esc(x.out)}</pre></div>
    <details class="reveal"><summary>Checklist de corrección</summary><div><ul class="checks">${x.checks.map((c,i)=>`<li><label><input type="checkbox" data-ck="${x.id}" data-i="${i}" ${ck.includes(i)?"checked":""}><span>${esc(c)}</span></label></li>`).join("")}</ul></div></details>
    ${x.hints.length?`<details class="reveal"><summary>Pistas</summary><div class="prose"><ul>${x.hints.map(h=>`<li>${h}</li>`).join("")}</ul></div></details>`:""}
    <details class="reveal"><summary>Solución</summary><div>${codeBlock(x.sol)}</div></details>
    <div class="ex-foot"><span class="stats">Probalo en tu PC: <code>npx tsc</code> y <code>node src/ejercicio${x.id[1]}.ts</code></span><button class="btn ${done[x.id]?"ok":""}" data-done="${x.id}">${done[x.id]?"✓ Lo resolví solo":"Marcar como resuelto solo"}</button></div>
  </article>`}).join(""):`<div class="empty"><p>No hay ejercicios para ese filtro.</p></div>`);
  view.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{S.set=b.dataset.set;store.set("set",S.set);render()});
  view.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const d=store.get("done",{});d[b.dataset.done]=!d[b.dataset.done];store.set("done",d);render()});
  view.querySelectorAll("[data-ck]").forEach(c=>c.onchange=()=>{const all=store.get("checks",{}),id=c.dataset.ck,i=+c.dataset.i;const s=new Set(all[id]||[]);c.checked?s.add(i):s.delete(i);all[id]=[...s];store.set("checks",all)});
  $("#tStart").onclick=()=>{store.set("timerStart",Date.now());render()};
  const ts=$("#tStop");if(ts)ts.onclick=()=>{store.set("timerStart",null);render()};
  tick();if(!timerId)timerId=setInterval(tick,1000);
}

renderUnits();render();
</script>
